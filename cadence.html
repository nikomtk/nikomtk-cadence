<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cadence">
<meta name="theme-color" content="#d9531e">
<title>Cadence</title>
<style>
:root{--bg:#f2f1f7;--card:#fff;--ink:#241d33;--mut:#6a647c;--o1:#d9531e;--o2:#c8384e;--line:#e6e3ef;--sl:#6d62d9;--wk:#b9bccb;--ml:#f0b93a;--sp:#ff6b3d;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#16131e;--card:#221e2d;--ink:#f3f0fa;--mut:#a9a3bc;--line:#352f45;--wk:#4a4c61;--sp:#ff8a5c;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next",system-ui,-apple-system,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0))}
.hd{background:linear-gradient(135deg,var(--o1),var(--o2));color:#fff;border-radius:0 0 28px 28px;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 24px}
.hd h1{margin:0;font-size:28px;letter-spacing:-.02em}.hd p{margin:4px 0 0;font-size:18px;font-weight:600}
main{max-width:560px;margin:0 auto;padding:0 16px 16px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 4px 18px rgba(80,40,20,.08)}
h2{font-size:18px;margin:20px 0 4px}.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
button,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:44px}
button.p{background:linear-gradient(135deg,var(--o1),var(--o2));border:0;color:#fff;font-weight:700}
button.on{border-color:var(--o1);box-shadow:inset 0 0 0 2px var(--o1);font-weight:700}
button.f{flex:1}
input{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:44px;width:100%}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:12px;min-height:58px;color:var(--mut)}
nav button.on{color:var(--o1);box-shadow:none;border-top:3px solid var(--o1)}
.rings{display:flex;justify-content:space-around;text-align:center;font-size:13px}
.strip{position:relative;height:16px;border-radius:8px;background:var(--bg);overflow:hidden;margin:4px 0}
.strip i{position:absolute;top:0;bottom:0}
.al{border-left:4px solid var(--o1);padding:8px 12px;margin:8px 0;background:var(--card);border-radius:8px}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.it:last-child{border:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cell{border-radius:12px;padding:6px 0;min-height:48px;background:var(--bg);font-size:13px;border:0}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:9}
.sheet>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0))}
#orb{width:200px;height:200px;border-radius:50%;margin:26px auto;background:radial-gradient(circle at 35% 30%,var(--o1),var(--o2));transform:scale(.6);display:grid;place-items:center;color:#fff;font-weight:700;font-size:22px}
@media(prefers-reduced-motion:reduce){#orb{transition:none!important}}
</style></head><body><div id="app"></div><nav id="nav"></nav>
<script>
const K='cadence_v1',JN=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'],JL=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{};S.cfg=Object.assign({ws:'07:30',we:'19:30',wake:'06:00',sl:7,midi:false,wd:[1,1,1,1,1,0,0]},S.cfg||{});['ov','wk','done','bil'].forEach(k=>S[k]=S[k]||{});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),z=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const tm=s=>{const[a,b]=s.split(':');return+a*60+ +b},fm=m=>z(Math.floor(m/60)%24)+':'+z(m%60);
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);x.setHours(0,0,0,0);return x};
const AT={M:{n:'Muscu (Hevy)',m:40,c:'#ff6b3d'},W:{n:'Marche rapide',m:35,c:'#f0a030'},V:{n:'Vélo tranquille',m:60,c:'#e5484d'},R:{n:'Respiration',m:7,c:'#7a6cf0'}};
const MSG=['Une séance courte vaut mieux qu’une séance parfaite jamais faite.','Le repos fait partie du programme.','Dormir est ton premier entraînement.','Tu construis une habitude, pas un exploit.','Rater un jour ne change rien. Rater deux, on ajuste.','Commence 10 minutes, le reste suit.'];
function info(d){
 const k=dk(d),i=(d.getDay()+6)%7,o=S.ov[k]||{},c=S.cfg,wake=tm(c.wake),bed=wake-c.sl*60+1440;
 let t=o.t||'n',w=null;
 if(t=='lock'||(t=='n'&&(c.wd[i]||o.s||o.e)))w=[o.s?tm(o.s):tm(c.ws),o.e?tm(o.e):tm(c.we)];
 const m=[],sl=[];
 if(w){const md=c.midi;m.push(md?[780,810]:[750,795]);if(md)sl.push([720,780,'midi']);sl.push([wake+20,w[0]-30,'matin']);m.push([w[1]+15,w[1]+60]);sl.push([w[1]+60,bed-30,'soir'])}
 else{m.push([750,795],[1170,1215]);sl.push([wake+20,750,'matin'],[795,1170,'aprem'],[1215,bed-30,'soir'])}
 return{t,w,m,sl:t=='lock'?[]:sl.filter(s=>s[1]-s[0]>=20),wake,bed}}
const defC=()=>{const L=Object.keys(S.bil).sort().slice(-3).map(k=>S.bil[k].f).filter(Boolean);return L.length>=3&&L.reduce((a,b)=>a+b)/3>=4?{M:2,W:2,V:0,R:5}:{M:3,W:2,V:1,R:5}};
function plan(mon){
 const D=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);const f=info(d);return{d,k:dk(d),f,it:[],sl:f.sl.map(s=>s.slice())}});
 const n=S.wk[dk(mon)]||defC(),q=[];
 'MVWR'.split('').forEach(t=>{for(let j=0;j<(n[t]||0);j++)q.push(t)});
 q.forEach(t=>{const a=AT[t];let b=null;
  D.forEach((x,i)=>x.sl.forEach(s=>{if(s[1]-s[0]<a.m)return;
   const sp=x.it.filter(u=>u.t!='R').length,tot=x.it.reduce((p,u)=>p+AT[u.t].m,0);
   if(t!='R'&&(sp>=2||tot+a.m>110))return;if(t=='R'&&x.it.some(u=>u.t=='R'))return;
   let sc=-i*.01;
   if(t=='M'){if(s[2]=='matin')sc+=3;if(sp)sc-=4;if([i-1,i+1].some(j=>D[j]&&D[j].it.some(u=>u.t=='M')))sc-=6}
   if(t=='V'){if(!x.f.w)sc+=5;if(i>4)sc+=2;if(sp)sc-=4}
   if(t=='W'){if(s[2]=='midi')sc+=3;if(!x.f.w)sc+=1;if(sp)sc-=3}
   if(t=='R'&&s[2]=='soir')sc+=3;
   if(!b||sc>b.sc)b={sc,x,s}}));
  if(b){const st=t=='R'?b.s[1]-a.m:(b.x.f.w?b.s[0]:Math.max(b.s[0],Math.min(510,b.s[1]-a.m)));b.x.it.push({t,s:st,e:st+a.m});if(t=='R')b.s[1]=st;else b.s[0]=st+a.m+10}});
 D.forEach(x=>x.it.sort((a,b)=>a.s-b.s));return{D,n}}
const dn=(x,u)=>x.k+u.t+u.s;
function ring(p,l,v,c){const r=30,C=2*Math.PI*r;return`<div><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*Math.min(p,1)} ${C}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">${v}</text></svg><div>${l}</div></div>`}
let tab='today',wo=0,ed=null;
function nav(){$('#nav').innerHTML=[['today','Aujourd’hui'],['week','Semaine'],['month','Mois'],['air','Souffle'],['set','Réglages']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(t){stopB();tab=t;render()}
function render(){nav();({today:vToday,week:vWeek,month:vMonth,air:vAir,set:vSet})[tab]();window.scrollTo(0,0)}
function strip(x){const a=300,b=1440,p=m=>((Math.max(a,Math.min(b,m))-a)/(b-a)*100);
 const seg=(s,e,c)=>e>s?`<i style="left:${p(s)}%;width:${p(e)-p(s)}%;background:${c}"></i>`:'';
 let h=seg(a,x.f.wake,'var(--sl)')+seg(x.f.bed,b,'var(--sl)');
 if(x.f.w)h+=seg(x.f.w[0],x.f.w[1],x.f.t=='lock'?'var(--ink)':'var(--wk)');
 x.f.m.forEach(m=>h+=seg(m[0],m[1],'var(--ml)'));x.it.forEach(u=>h+=seg(u.s,u.e,AT[u.t].c));return`<div class="strip">${h}</div>`}
const leg='<div class="leg"><span>🟣 sommeil</span><span>⬜ travail</span><span>🟡 repas</span><span>🟠 activités</span></div>';
function tips(P){const t=[],L=Object.keys(S.bil).sort().map(k=>S.bil[k]);
 if(L.slice(-2).length==2&&L.slice(-2).every(e=>e.f>=4))t.push('Fatigue élevée deux jours de suite : garde ton sommeil, fais la muscu en version courte et saute le vélo.');
 const l=L[L.length-1];if(l&&l.sl&&l.sl<6.5)t.push('Nuit courte ('+l.sl+' h) : couche-toi plus tôt ce soir, c’est la priorité.');
 P.D.forEach((x,i)=>{if(x.f.w&&x.f.w[1]>1290)t.push(JL[i]+' finit à '+fm(x.f.w[1])+' : pour tes '+S.cfg.sl+' h, couche-toi à '+fm(x.f.w[1]+45)+' au plus tôt et décale ton réveil du lendemain à '+fm(x.f.w[1]+45+S.cfg.sl*60)+'.')});
 const wm=P.D.reduce((p,x)=>p+(x.f.w?x.f.w[1]-x.f.w[0]:0),0);if(wm>3700)t.push('Semaine dense ('+Math.round(wm/60)+' h de travail et trajets) : passe à 2 séances de muscu et privilégie la marche.');
 const left=P.D.filter(x=>x.k>=dk(new Date())).reduce((p,x)=>p+x.it.filter(u=>u.t=='M'&&!S.done[dn(x,u)]).length,0);if(left)t.push('Il te reste '+left+' séance'+(left>1?'s':'')+' de muscu à faire cette semaine.');
 return t}
function vToday(){
 const n=new Date(),k=dk(n),P=plan(monday(n)),x=P.D.find(y=>y.k==k),B=S.bil[k]||{};
 const all=P.D.flatMap(y=>y.it.filter(u=>u.t!='R').map(u=>dn(y,u))),dn1=all.filter(a=>S.done[a]).length;
 const rs=P.D.flatMap(y=>y.it.filter(u=>u.t=='R').map(u=>dn(y,u))),rd=rs.filter(a=>S.done[a]).length;
 const sl=Object.keys(S.bil).sort().slice(-3).map(q=>S.bil[q].sl).filter(Boolean),sa=sl.length?sl.reduce((a,b)=>a+b)/sl.length:0;
 const nx=x.it.find(u=>!S.done[dn(x,u)]&&u.e>n.getHours()*60+n.getMinutes());
 $('#app').innerHTML=`<div class="hd"><h1>${JL[(n.getDay()+6)%7]} ${n.getDate()}/${n.getMonth()+1}</h1><p>${nx?AT[nx.t].n+' à '+fm(nx.s):'Rien d’autre de prévu aujourd’hui'}</p></div><main>
 <div class="card rings">${ring(all.length?dn1/all.length:0,'Séances',dn1+'/'+all.length,'#ff6b3d')}${ring(sa/S.cfg.sl,'Sommeil',sa?sa.toFixed(1)+' h':'-','#6d62d9')}${ring(rs.length?rd/rs.length:0,'Souffle',rd+'/'+rs.length,'#7a6cf0')}</div>
 <div class="mut" style="margin:10px 4px">${MSG[Math.floor(n/864e5)%MSG.length]}</div>
 ${tips(P).map(t=>`<div class="al">${t}</div>`).join('')}
 <h2>Aujourd’hui</h2><div class="card">${strip(x)}${x.f.w?`<div class="mut">Travail ${fm(x.f.w[0])}-${fm(x.f.w[1])}${x.f.t=='lock'?' (journée bloquée)':''}</div>`:'<div class="mut">Pas de travail aujourd’hui</div>'}
 ${x.it.map(u=>`<div class="it"><span class="dot" style="background:${AT[u.t].c}"></span><div style="flex:1"><b>${AT[u.t].n}</b><div class="mut">${fm(u.s)}-${fm(u.e)}</div></div><button class="${S.done[dn(x,u)]?'on':''}" onclick="S.done['${dn(x,u)}']=!S.done['${dn(x,u)}'];save();vToday()">${S.done[dn(x,u)]?'Fait':'À faire'}</button></div>`).join('')||'<p class="mut">Journée de repos, c’est voulu.</p>'}${leg}</div>
 <h2>Bilan du jour</h2><div class="card"><label>Fatigue (1 = en forme, 5 = épuisé)</label><div class="row">${[1,2,3,4,5].map(v=>`<button class="${B.f==v?'on':''}" onclick="bs('f',${v})">${v}</button>`).join('')}</div>
 <label>Sommeil cette nuit (h)</label><input id="bs" type="number" step="0.25" inputmode="decimal" value="${B.sl||''}"><label>Poids (kg)</label><input id="bw" type="number" step="0.1" inputmode="decimal" value="${B.w||''}">
 <button class="p" style="width:100%;margin-top:12px" onclick="bs()">Enregistrer</button></div>
 <h2>Pour que je réajuste</h2><div class="card"><button class="p" onclick="cp(sum())">Copier le bilan de la semaine</button></div></main>`}
function bs(f,v){const k=dk(new Date()),B=S.bil[k]||{};if(f)B[f]=v;if($('#bs')){B.sl=parseFloat($('#bs').value.replace(',','.'))||undefined;B.w=parseFloat($('#bw').value.replace(',','.'))||undefined}S.bil[k]=B;save();vToday()}
function sum(){const P=plan(monday(new Date()));return'Bilan de ma semaine :\n'+P.D.map((x,i)=>JN[i]+' : '+(x.f.t=='lock'?'bloqué':x.f.w?'travail '+fm(x.f.w[0])+'-'+fm(x.f.w[1]):'libre')+' | '+(x.it.map(u=>AT[u.t].n+' '+fm(u.s)+(S.done[dn(x,u)]?' (fait)':'')).join(', ')||'repos')+(S.bil[x.k]?' | fatigue '+(S.bil[x.k].f||'-')+', sommeil '+(S.bil[x.k].sl||'-')+' h'+(S.bil[x.k].w?', '+S.bil[x.k].w+' kg':''):'')).join('\n')}
function cp(t){const ok=()=>alert('Copié.');try{navigator.clipboard.writeText(t).then(ok,()=>fb(t))}catch(e){fb(t)}}
function fb(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');alert('Copié.')}catch(e){prompt('Copie ce texte :',t)}a.remove()}
function vWeek(){
 const mon=monday(new Date());mon.setDate(mon.getDate()+7*wo);const mk=dk(mon),P=plan(mon),n=P.n;
 $('#app').innerHTML=`<div class="hd"><h1>Semaine</h1><p>Du ${mon.getDate()}/${mon.getMonth()+1}</p></div><main>
 <div class="row" style="margin-top:12px"><button class="f ${wo==0?'on':''}" onclick="wo=0;vWeek()">Cette semaine</button><button class="f ${wo==1?'on':''}" onclick="wo=1;vWeek()">Suivante</button></div>
 <h2>Choisis tes activités</h2><p class="mut" style="margin:0">Proposition adaptée à ta fatigue. Ajuste, je planifie.</p><div class="card">${Object.keys(AT).map(t=>`<div class="it"><span class="dot" style="background:${AT[t].c}"></span><div style="flex:1"><b>${AT[t].n}</b><div class="mut">${AT[t].m} min</div></div><button onclick="ct('${mk}','${t}',-1)">−</button><b style="width:22px;text-align:center">${n[t]||0}</b><button onclick="ct('${mk}','${t}',1)">+</button></div>`).join('')}</div>
 <h2>Planning</h2><div class="card">${P.D.map((x,i)=>`<div style="padding:8px 0"><div class="row sp"><b>${JN[i]} ${x.d.getDate()}</b><button style="min-height:36px;padding:4px 10px" onclick="edit('${x.k}')">${x.f.t=='lock'?'Bloqué':x.f.t=='off'?'Libre':x.f.w?fm(x.f.w[0])+'-'+fm(x.f.w[1]):'Libre'} ✎</button></div>${strip(x)}<div class="mut">${x.it.map(u=>AT[u.t].n+' '+fm(u.s)).join(' · ')||'Repos'}</div></div>`).join('')}${leg}</div>
 <p class="mut">Touche l’horaire d’un jour pour le modifier, le bloquer ou le libérer.</p></main>`}
function ct(mk,t,d){const n=Object.assign({},S.wk[mk]||plan(new Date(mk+'T00:00')).n);n[t]=Math.max(0,Math.min(7,(n[t]||0)+d));S.wk[mk]=n;save();vWeek()}
function edit(k){ed=k;const o=S.ov[k]||{},d=new Date(k+'T00:00'),f=info(d);
 const s=document.createElement('div');s.className='sheet';s.id='sh';s.innerHTML=`<div><h2 style="margin-top:0">${JL[(d.getDay()+6)%7]} ${d.getDate()}/${d.getMonth()+1}</h2><div class="row">${[['n','Normal'],['off','Libre (off)'],['lock','Bloqué (on)']].map(([v,l])=>`<button class="f ${(o.t||'n')==v?'on':''}" onclick="ov('t','${v}')">${l}</button>`).join('')}</div>
 <p class="mut">Libre : pas de travail, toute la journée disponible. Bloqué : journée prise, aucune activité.</p><div class="row"><div style="flex:1"><label>Début travail</label><input id="os" type="time" value="${o.s||(f.w?fm(f.w[0]):S.cfg.ws)}"></div><div style="flex:1"><label>Fin travail</label><input id="oe" type="time" value="${o.e||(f.w?fm(f.w[1]):S.cfg.we)}"></div></div>
 <div class="row" style="margin-top:14px"><button class="p f" onclick="ovs()">Appliquer ces horaires</button><button class="f" onclick="delete S.ov[ed];save();cl()">Réinitialiser</button><button class="f" onclick="cl()">Fermer</button></div></div>`;document.body.appendChild(s)}
function cl(){const s=$('#sh');if(s)s.remove();render()}
function ov(f,v){S.ov[ed]=Object.assign(S.ov[ed]||{},{[f]:v});if(v!='n'||f!='t'){}save();cl()}
function ovs(){S.ov[ed]=Object.assign(S.ov[ed]||{},{s:$('#os').value,e:$('#oe').value});if(S.ov[ed].t=='off')S.ov[ed].t='n';save();cl()}
function vMonth(){
 const m0=monday(new Date());let h='';
 for(let w=0;w<4;w++){const mon=new Date(m0);mon.setDate(mon.getDate()+7*w);const P=plan(mon);
  h+=`<div class="mut" style="margin:10px 0 4px">Semaine du ${mon.getDate()}/${mon.getMonth()+1}</div><div class="grid">${P.D.map((x,i)=>{const nb=x.it.filter(u=>u.t!='R').length,c=x.f.t=='lock'?'var(--wk)':!x.f.w?'#cfeedd':nb?'#ffd9c7':'var(--bg)';
   return`<button class="cell" style="background:${c};color:#241d33" onclick="ed='${x.k}';edit('${x.k}')"><b>${x.d.getDate()}</b><div>${x.f.t=='lock'?'■':nb?'●'.repeat(nb):'·'}</div></button>`}).join('')}</div>`}
 $('#app').innerHTML=`<div class="hd"><h1>Mois</h1><p>4 semaines à venir</p></div><main><div class="card"><div class="grid mut">${JN.map(j=>`<div>${j}</div>`).join('')}</div>${h}<div class="leg" style="margin-top:12px"><span>■ bloqué</span><span>● activité</span><span>🟩 libre</span></div></div><p class="mut">Touche un jour pour le bloquer, le libérer ou changer ses horaires.</p></main>`}
let AC,T1,voice=true,preset='4-6',mins=5,run=false;
const PR={'4-6':[['Inspire',4,520],['Expire',6,390]],'4-7-8':[['Inspire',4,520],['Retiens',7,0],['Expire',8,390]],'Carré':[['Inspire',4,520],['Retiens',4,0],['Expire',4,390],['Pause',4,0]]};
function beep(f,d,v){if(!AC||!f)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.05,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}
function say(t){try{if(!voice||!speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.volume=.6;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function vAir(){$('#app').innerHTML=`<div class="hd"><h1>Souffle</h1><p>Écouteurs, assis, on y va</p></div><main><div class="row" style="margin-top:12px">${Object.keys(PR).map(p=>`<button class="f ${preset==p?'on':''}" onclick="preset='${p}';vAir()">${p}</button>`).join('')}</div>
 <div class="row" style="margin-top:8px">${[3,5,10].map(m=>`<button class="f ${mins==m?'on':''}" onclick="mins=${m};vAir()">${m} min</button>`).join('')}<button class="f ${voice?'on':''}" onclick="voice=!voice;vAir()">Voix ${voice?'oui':'non'}</button></div>
 <div id="orb" style="transition:transform 1s linear">Prêt</div><div class="row"><button class="p f" id="go" onclick="startB()">Démarrer</button></div><p class="mut">Un bip doux par phase, deux notes à la fin. Si tu n’entends rien : volume, et iPhone pas en silencieux.</p></main>`}
function stopB(){run=false;clearTimeout(T1);try{speechSynthesis.cancel()}catch(e){}}
function startB(){if(run){stopB();vAir();return}
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
 run=true;$('#go').textContent='Arrêter';const ph=PR[preset],end=Date.now()+mins*6e4;let i=0;
 (function step(){if(!run)return;
  if(Date.now()>=end){run=false;beep(523,1.2,.06);setTimeout(()=>beep(659,1.6,.06),500);say('Terminé. Bravo.');const o=$('#orb');o.style.transform='scale(.6)';o.textContent='Terminé';$('#go').textContent='Recommencer';return}
  const[n,s,f]=ph[i%ph.length],o=$('#orb');i++;o.textContent=n;o.style.transition=`transform ${s}s ease-in-out`;
  if(n=='Inspire')o.style.transform='scale(1)';if(n=='Expire')o.style.transform='scale(.6)';
  beep(f,.5,.05);say(n);T1=setTimeout(step,s*1000)})()}
function vSet(){const c=S.cfg;$('#app').innerHTML=`<div class="hd"><h1>Réglages</h1><p>Ta semaine type</p></div><main><div class="card">
 <div class="row"><div style="flex:1"><label>Début travail (trajets inclus)</label><input id="c1" type="time" value="${c.ws}"></div><div style="flex:1"><label>Fin travail</label><input id="c2" type="time" value="${c.we}"></div></div>
 <label>Jours travaillés</label><div class="row">${JN.map((j,i)=>`<button class="${c.wd[i]?'on':''}" onclick="S.cfg.wd[${i}]=${c.wd[i]?0:1};save();vSet()">${j}</button>`).join('')}</div>
 <div class="row"><div style="flex:1"><label>Réveil</label><input id="c3" type="time" value="${c.wake}"></div><div style="flex:1"><label>Sommeil visé (h)</label><input id="c4" type="number" step="0.25" value="${c.sl}"></div></div>
 <label>Sport possible sur le temps de midi (12h-13h)</label><div class="row"><button class="f ${c.midi?'on':''}" onclick="S.cfg.midi=true;save();vSet()">Oui</button><button class="f ${!c.midi?'on':''}" onclick="S.cfg.midi=false;save();vSet()">Non</button></div>
 <button class="p" style="width:100%;margin-top:14px" onclick="S.cfg.ws=$('#c1').value;S.cfg.we=$('#c2').value;S.cfg.wake=$('#c3').value;S.cfg.sl=parseFloat($('#c4').value)||7;save();alert('Enregistré.')">Enregistrer</button></div>
 <h2>Sauvegarde</h2><div class="card"><p class="mut" style="margin-top:0">Les données sont dans ton iPhone. Sauvegarde de temps en temps.</p><button onclick="cp(JSON.stringify(S))">Copier la sauvegarde</button><label>Restaurer</label><input id="im" placeholder="Colle ici une sauvegarde"><button style="margin-top:8px" onclick="try{S=JSON.parse($('#im').value);save();alert('Restauré.');render()}catch(e){alert('Sauvegarde illisible.')}">Restaurer</button></div></main>`}
render();
</script></body></html>
